services:
  postgres:
    image: postgres:16-alpine
    container_name: vibetune_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: vibetune_db
      POSTGRES_USER: vibetune_admin
      POSTGRES_PASSWORD: vibetune_secret_password
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vibetune_admin -d vibetune_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
